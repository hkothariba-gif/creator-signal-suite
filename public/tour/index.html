  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* Aspen brand kit -> engine tokens */
    :root, .sw-root {
      --sw-bg: #FAF7F1;          /* cream == the scene background colour */
      --sw-ink: #17141E;         /* dark ink — headings + body */
      --sw-ink-soft: #6A6472;    /* muted charcoal for secondary text */
      --sw-accent: #F2542D;      /* signal orange (per-section accents override) */
      --sw-font-display: 'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif;
      --sw-font-body: 'Instrument Sans', ui-sans-serif, system-ui, sans-serif;
    }
    html, body { margin: 0; background: #FAF7F1; }

    /* --- Copy legibility polish (unlayered, so it wins over the engine's @layer sw) ---
       The clay world is bright and busy, so dark copy over it needs a stronger cream
       scrim + a soft cream halo on the text itself. */
    .sw-copylayer::before {
      width: min(66vw, 900px);
      background: linear-gradient(90deg,
        var(--sw-bg) 0%,
        var(--sw-bg) 40%,
        color-mix(in srgb, var(--sw-bg) 86%, transparent) 58%,
        color-mix(in srgb, var(--sw-bg) 48%, transparent) 76%,
        transparent 100%);
    }
    .sw-copy__title {
      text-shadow: 0 2px 18px var(--sw-bg), 0 1px 4px color-mix(in srgb, var(--sw-bg) 92%, transparent);
    }
    .sw-copy__body {
      color: color-mix(in srgb, var(--sw-ink) 88%, var(--sw-ink-soft));
      text-shadow: 0 1px 10px var(--sw-bg), 0 1px 3px var(--sw-bg);
    }
    .sw-copy__eyebrow { text-shadow: 0 1px 8px var(--sw-bg); }
    @media (max-width: 860px) {
      /* On phones the copy sits at the bottom — deepen that scrim too. */
      .sw-copylayer::before {
        width: 100%; height: 68%; top: auto; bottom: 0;
        background: linear-gradient(0deg,
          var(--sw-bg) 12%,
          color-mix(in srgb, var(--sw-bg) 82%, transparent) 42%,
          color-mix(in srgb, var(--sw-bg) 30%, transparent) 68%,
          transparent 100%);
      }
    }
</style>
</head>
<body>
